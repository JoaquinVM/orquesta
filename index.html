<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orquesta · Agent dispatcher</title>
<meta name="description" content="Dirige la startup: reparte tareas entre agentes de IA, contrata, forma a tu equipo y llega a la Serie A en 10 sprints. / Run a startup of AI agents in this free browser strategy game.">
<meta property="og:title" content="Orquesta: dirige un equipo de agentes de IA">
<meta property="og:description" content="10 sprints para llegar a la Serie A. Reparte el trabajo, contrata, forma a tus agentes y entrega funcionalidades. ¿Cuánto vale tu startup?">
<meta property="og:type" content="website">
<meta property="og:url" content="https://joaquinvm.github.io/orquesta/">
<meta property="og:image" content="https://joaquinvm.github.io/orquesta/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Orquesta: juego de estrategia para dirigir una startup de agentes de IA">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b1020">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎼</text></svg>">
<style>
:root{
  --bg:#0b1020;--panel:#121a2f;--panel2:#18223d;--line:#26314f;
  --text:#e8ecf8;--muted:#8d97b5;--accent:#8b5cf6;--accent2:#22d3ee;
  --good:#4ade80;--warn:#fbbf24;--bad:#f87171;--gold:#fcd34d;
  --code:#60a5fa;--design:#f472b6;--data:#facc15;--test:#4ade80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%,#22174a 0,transparent 60%),
    radial-gradient(900px 500px at 110% 0%,#0d2c3d 0,transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
button{font:inherit;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
#app{max-width:1120px;margin:0 auto;padding:14px 16px 18px;min-height:100vh;display:flex;flex-direction:column;gap:12px}
#app.shake{animation:shake .28s}

/* Header */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:26px}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px;min-width:62px;transition:border-color .3s}
.stat b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.money b{color:var(--gold)}
.stat.streak b{color:var(--accent2)}
.stat.hot{border-color:#f97316;box-shadow:0 0 14px rgba(249,115,22,.35)}
.stat.hot b{color:#fb923c}
.stat .goal{display:block;height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:3px;overflow:hidden}
.stat .goal i{display:block;height:100%;width:0;background:var(--accent2)}
.stat.ending .goal i{background:var(--warn)}
.stars{color:var(--gold);letter-spacing:1px}
.stat .stars .off{display:inline;color:#3a4466;font-size:inherit;letter-spacing:1px;text-transform:none}
.bump{animation:bump .25s}
.ctrl{display:flex;gap:6px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;transition:transform .1s,background .2s}
.btn:hover:not(:disabled){background:#202c4d}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.primary{background:linear-gradient(135deg,var(--accent),#6d28d9);border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.daily{background:linear-gradient(135deg,#f59e0b,#ea580c);border-color:transparent;color:#1a1205}
.btn.danger{color:var(--bad)}

/* Board */
main{display:grid;grid-template-columns:1.15fr 1fr;gap:12px;flex:1;align-items:start}
.panel{background:rgba(18,26,47,.82);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.mode{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(245,158,11,.16);color:var(--warn);text-transform:none;letter-spacing:0}
.slots{font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px;background:var(--panel2)}
.slots.full{background:rgba(248,113,113,.18);color:var(--bad)}
#tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;align-content:start;min-height:230px}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:60px 0;font-size:14px}

.task{position:relative;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:9px 10px 13px;cursor:pointer;overflow:hidden;animation:drop .3s cubic-bezier(.2,1.4,.4,1);transition:transform .15s,box-shadow .15s}
.task:hover{transform:translateY(-1px)}
.task.sel{outline:2px solid var(--accent2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(34,211,238,.25)}
.task .tn{font-weight:650;font-size:14px;line-height:1.25}
.task .tm{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.task .size{letter-spacing:1px;color:var(--c)}
.task .pay{color:var(--gold);margin-left:auto;font-variant-numeric:tabular-nums}
.task .ch{display:inline-block;font-size:11px;color:var(--accent2);margin-bottom:2px}
.task .pat{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.06)}
.task .pat i{display:block;height:100%;background:var(--good)}
.task.warn .pat i{background:var(--warn)}
.task.urgent .pat i{background:var(--bad)}
.task.urgent{animation:pulse 1s ease-in-out infinite}
.task.bug{background:linear-gradient(135deg,rgba(248,113,113,.14),var(--panel2) 60%)}
.task.chain{background:linear-gradient(135deg,rgba(34,211,238,.10),var(--panel2) 60%)}
.task.hint{box-shadow:0 0 0 2px var(--accent2);animation:hint 1.2s ease-in-out infinite}

#agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.agent{position:relative;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;transition:opacity .2s,box-shadow .2s,transform .15s;animation:pop .3s ease-out}
.agent .av{font-size:26px;width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border-radius:12px;grid-row:span 2;transition:transform .2s}
.agent:not(.busy):not(.away) .av{animation:bob 2.4s ease-in-out infinite}
.agent.busy .av{animation:work .5s ease-in-out infinite alternate}
.agent .an{font-weight:700}
.agent .sk{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);white-space:nowrap}
.chip.dim{opacity:.55;border-style:dashed}
.agent .st{grid-column:1/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.agent .bar{grid-column:1/-1;height:6px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.agent .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.agent .kbd{position:absolute;top:8px;right:9px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.agent.match{box-shadow:0 0 0 2px var(--good),0 0 18px rgba(74,222,128,.25);transform:translateY(-1px)}
.agent.weak{box-shadow:0 0 0 2px var(--warn)}
.agent.nope{opacity:.4}
.agent.away{opacity:.5;cursor:not-allowed;background:repeating-linear-gradient(135deg,var(--panel2) 0 10px,#1b2645 10px 20px)}
.agent.shake{animation:shake .3s}
.agent.flash{animation:flash .45s}
.tip{font-size:12px;color:var(--muted);line-height:1.5}
.tip .chip{margin-right:2px}

#log{min-height:22px;font-size:13px;color:var(--muted);text-align:center}
#log span{animation:fadeIn .3s}
.foot{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.foot a{color:var(--muted)}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:10}
.overlay[hidden]{display:none}
.card{max-width:580px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;max-height:calc(100vh - 32px);overflow:auto;animation:pop .25s ease-out;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.card.wide{max-width:720px}
.card h2{margin:0 0 6px;font-size:26px}
.card h3{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
.card h3 small{text-transform:none;letter-spacing:0;font-size:12px}
.card .big{font-size:42px;line-height:1}
.card p{color:var(--muted);margin:6px 0 14px}
.card ol{padding-left:20px;margin:0 0 18px;display:grid;gap:8px}
.card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.card .kb{font-size:11px;color:var(--muted)}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.meta span{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.meta b{color:var(--text)}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.results div{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
.results b{display:block;font-size:22px}
.results span{font-size:11px;color:var(--muted)}
.badge{display:inline-block;background:linear-gradient(135deg,var(--warn),#f97316);color:#1a1205;font-weight:800;border-radius:999px;padding:3px 10px;font-size:12px}
.rank{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.rank .ri{font-size:28px}
.rank .rn{display:block;font-size:17px}
.rank small{display:block;color:var(--muted)}
.rank small b{color:var(--text)}
.rank .rb{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:5px;overflow:hidden}
.rank .rb i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.near{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:13px;margin:0 0 10px}
.near b{color:var(--text)}
.grid{font-size:15px;line-height:1.35;letter-spacing:1px;background:var(--panel2);border-radius:12px;padding:10px 12px;margin:0 0 10px;white-space:pre-wrap}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:4px 0 14px}
.achs span{display:grid;place-items:center;height:42px;border-radius:10px;background:var(--panel2);font-size:20px;border:1px solid var(--line)}
.achs span.off{filter:grayscale(1);opacity:.3}

/* Planning */
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px}
.ledger div{background:var(--panel2);border-radius:12px;padding:8px 10px}
.ledger b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.ledger span{font-size:11px;color:var(--muted)}
.ledger .pos{color:var(--good)} .ledger .neg{color:var(--bad)} .ledger .gold{color:var(--gold)}
.news{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);border-radius:12px;padding:10px 12px;margin:12px 0 0;display:grid;gap:6px;font-size:14px}
.news b{color:var(--accent2)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.row .av{font-size:24px;width:40px;height:40px;display:grid;place-items:center;background:var(--panel);border-radius:10px}
.row .nm{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .nm small{font-weight:500;color:var(--muted)}
.row .sk{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.row .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .sub{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px;align-items:center;font-size:12px;color:var(--muted)}
.xp{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:4px;max-width:180px}
.xp i{display:block;height:100%;background:var(--accent2)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.item{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:grid;gap:2px}
.item:hover:not(:disabled){border-color:var(--accent)}
.item b{font-size:14px}
.item small{color:var(--muted)}
.item .cost{color:var(--gold);font-weight:700;font-size:13px}
.item.owned{border-color:var(--good);cursor:default}
.item.owned .cost{color:var(--good)}
.cost{color:var(--gold);font-variant-numeric:tabular-nums}
.payroll{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.payroll .warn{color:var(--bad);font-weight:700}

/* Juice */
.float{position:fixed;font-weight:800;color:var(--gold);pointer-events:none;animation:rise 1s ease-out forwards;z-index:5;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.float.bad{color:var(--bad)}
.spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:6;animation:spark .7s cubic-bezier(.1,.6,.3,1) forwards}
.combo{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:40px;font-weight:900;pointer-events:none;z-index:7;color:#fb923c;text-shadow:0 4px 24px rgba(249,115,22,.6);animation:combo 1.1s ease-out forwards;white-space:nowrap;text-align:center}
.combo.blue{color:var(--accent2);text-shadow:0 4px 24px rgba(34,211,238,.55)}
#toasts{position:fixed;top:10px;left:16px;display:grid;gap:6px;z-index:20;pointer-events:none;width:min(calc(100vw - 32px),320px)}
.toast{background:var(--panel);border:1px solid var(--warn);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toast 3.2s ease-in-out forwards}
.toast .ti{font-size:22px}
.toast small{display:block;color:var(--muted);font-size:11px}
body.hurt::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px var(--bad),inset 0 0 90px rgba(248,113,113,.35);animation:fade .6s forwards;z-index:4}

@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pulse{50%{border-color:var(--bad)}}
@keyframes hint{50%{box-shadow:0 0 0 5px rgba(34,211,238,.35)}}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes bump{50%{transform:scale(1.18)}}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes work{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes flash{30%{box-shadow:0 0 0 2px var(--good),0 0 30px rgba(74,222,128,.55)}}
@keyframes rise{to{transform:translateY(-40px);opacity:0}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(220deg);opacity:0}}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}35%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%,85%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
@keyframes fade{to{opacity:0}}
@keyframes fadeIn{from{opacity:0}}

@media (max-width:780px){
  main{grid-template-columns:1fr}
  .ctrl{order:2;margin-left:auto}
  .hud{order:3;margin-left:0;width:100%}
  .stat{flex:1;min-width:0;padding:4px 8px}
  .stat b{font-size:14px}
  #tasks{grid-template-columns:repeat(2,minmax(0,1fr));min-height:160px}
  #agents{grid-template-columns:repeat(2,minmax(0,1fr))}
  .agent{grid-template-columns:1fr;padding:8px}
  .agent .av{grid-row:auto;width:36px;height:36px;font-size:22px}
  .agent .kbd{display:none}
  .card{padding:18px}
  .results b{font-size:18px}
  .ledger{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:auto 1fr}
  .row .btns{grid-column:1/-1;justify-content:flex-start}
  .combo{font-size:30px}
}
@media (pointer:coarse){.card .kb.keys,.foot [data-t=keys]{display:none}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="logo">🎼</span>
      <div><h1>Orquesta</h1><p data-t="sub"></p></div>
    </div>
    <div class="hud">
      <div class="stat money"><span data-t="cash"></span><b id="hMoney">💰 0</b></div>
      <div class="stat" id="sSprint"><span data-t="sprint"></span><b id="hSprint">1/10</b><span class="goal"><i id="hTime"></i></span></div>
      <div class="stat"><span data-t="rep"></span><b id="hRep" class="stars"></b></div>
      <div class="stat streak" id="sStreak"><span data-t="streak"></span><b id="hStreak">×1.00</b></div>
    </div>
    <div class="ctrl">
      <button class="btn" id="soundBtn" aria-label="Sound">🔊</button>
      <button class="btn" id="langBtn" aria-label="Language">EN</button>
      <button class="btn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2><span data-t="inbox"></span><span style="display:flex;gap:6px;align-items:center"><span class="mode" id="modeTag" hidden></span><span class="slots" id="slots">0/6</span></span></h2>
      <div id="tasks"></div>
    </section>
    <section class="panel">
      <h2><span data-t="team"></span><span id="payTag" style="text-transform:none;letter-spacing:0"></span></h2>
      <div id="agents"></div>
      <div class="tip" id="tip"></div>
    </section>
  </main>

  <div id="log"></div>
  <div class="foot">
    <span data-t="keys"></span>
    <a href="https://github.com/JoaquinVM/orquesta" target="_blank" rel="noopener" data-t="source"></a>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div class="overlay" id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
'use strict';

/* =====================================================================
   Tuning — every number that shapes pacing and the economy lives here.
   ===================================================================== */
const CFG = {
  sprints: 10,            // a run is a "season" of 10 sprints
  sprintLen: 75,          // seconds of real-time work per sprint
  startMoney: 120,
  maxRep: 5,
  cap: 6,                 // inbox slots
  maxAgents: 6,
  baseWork: 6,            // seconds per size unit at speed 1
  spawnBase: 8.6, spawnStep: 0.48, spawnMin: 4.2,   // seconds between new tasks
  patienceBase: 40, patienceStep: 1.4, patienceMin: 24, patiencePerSize: 4,
  pay: (size, sprint) => size * (10 + sprint),
  chainBonus: sprint => 40 + 10 * sprint,
  chainChance: 0.34,
  streakStep: 0.05, streakCap: 10,                  // +5% per task, max +50%
  // Skill levels: 0 untrained · 1 Jr · 2 Sr · 3 Expert. XP = task size done of that type.
  lvlXp:   [0, 6, 18, 40],
  lvlSpeed:[0.45, 0.8, 1.1, 1.45],
  lvlBug:  [0.35, 0.12, 0.05, 0.015],
  trainCost: [0, 80, 160, 280],
  salaryBase: 40, salaryPerLevel: 12,
  hire: { 1: { fee: 80, salary: 40 }, 2: { fee: 180, salary: 70 } },
};
const CHAIN = ['design', 'code', 'test'];

const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = n => Math.round(n).toLocaleString(lang === 'es' ? 'es-ES' : 'en-US');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Two seeded streams for the daily: "deal" (what arrives) is independent of "luck" (bugs, candidates).
const R = { deal: Math.random, luck: Math.random };
const rnd = (a, b, r = R.luck) => a + r() * (b - a);
const pick = (a, r = R.luck) => a[Math.floor(r() * a.length)];

/* ---------- Sound ---------- */
let actx = null;
function tone(freq, dur = 0.12, type = 'sine', vol = 0.07, delay = 0) {
  if (!P.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}

  coin: () => { tone(988, .06, 'square', .03); tone(1319, .12, 'square', .03, .06); },

  ach: () => [784, 988, 1319, 1568].forEach((f, i) => tone(f, .22, 'sine', .05, i * .07)),

  combo: () => [880, 1109, 1319].forEach((f, i) => tone(f, .14, 'square', .03, i * .05)),

  const used = usedNames();
  const free = AGENT_POOL.filter(([n]) => !used.has(n));
  return free.length ? pick(free) : ['Agent ' + uid, '🤖'];
}
function mkAgent(name, avatar, type, lvl, salaryExtra = 0) {
  return { id: 'a' + uid++, name, avatar, xp: { [type]: CFG.lvlXp[lvl] }, task: null, progress: 0, work: 1, training: null, salaryExtra };
}

function newGame(daily = false) {
  const n = dayNum();
  R.deal = daily ? mulberry32(n * 7919 + 17) : Math.random;
  R.luck = daily ? mulberry32(n * 104729 + 3) : Math.random;
  S = {
    daily, dayN: n, phase: 'idle', sprint: 1, sprintT: 0, money: CFG.startMoney, rep: CFG.maxRep,
    streak: 0, maxStreak: 0, cap: CFG.cap, speed: 1, bugMul: 1, owned: {},
    spawnIn: 1, tasks: [], agents: [], pending: [], chains: {}, selected: null,
    stats: { done: 0, chains: 0, lvups: 0 }, cur: null, history: [], plan: null,
    paused: false, dirty: true, rank: 0, endWarned: false, result: null,
  };
  S.agents.push(mkAgent('Nova', '🤖', 'code', 1), mkAgent('Pixel', '👾', 'design', 1));
  S.cur = freshSprintStats();
}
const freshSprintStats = () => ({ income: 0, done: 0, missed: 0, chains: 0, bugs: 0 });
const isSkilled = (a, t) => lvlOf(a, t.type) >= 1;
const workTime = (a, t) => (t.bug ? 2.5 : t.size * CFG.baseWork) / (S.speed * CFG.lvlSpeed[lvlOf(a, t.type)]);
const bugRisk = (a, t) => t.bug ? 0 : CFG.lvlBug[lvlOf(a, t.type)] * S.bugMul;

/* ---------- Sprint loop ---------- */
function spawnTask(o = {}) {
  if (S.tasks.length >= S.cap) { hurt('overflow'); return; }
  const n = S.sprint;
  const big = Math.min(0.28, 0.04 + n * 0.025);
  const r = R.deal();
  const size = o.size || (r < big ? 3 : r < big + 0.35 ? 2 : 1);
  const patience = o.patience || Math.max(CFG.patienceMin, CFG.patienceBase - n * CFG.patienceStep) + size * CFG.patiencePerSize;
  const type = o.type || pick(typesFor(n), R.deal);
  S.tasks.push({ id: 't' + uid++, type, size, name: o.name ?? Math.floor(R.deal() * 64), bug: !!o.bug,
    chain: o.chain || null, stage: o.stage ?? 0, fname: o.fname ?? 0, patience, left: patience });
  S.dirty = true;
}
function spawnNext() {
  if (S.sprint >= 3 && R.deal() < CFG.chainChance) {
    const id = 'c' + uid++, fname = Math.floor(R.deal() * 64), size = R.deal() < 0.5 ? 1 : 2;
    S.chains[id] = { id, fname, size };
    spawnTask({ type: CHAIN[0], chain: id, stage: 0, fname, size });
  } else spawnTask();
}

function assign(taskId, agentId) {
  const t = S.tasks.find(x => x.id === taskId);
  const a = S.agents.find(x => x.id === agentId);
  if (!t || !a) return;
  const el = agentEls.get(a.id);
  if (a.task || a.training) {
    log(fmt(a.training ? T().log.awayL : T().log.busy, { a: a.name })); sfx.deny();
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    return;
  }
  S.tasks = S.tasks.filter(x => x !== t);
  a.task = t; a.progress = 0; a.work = workTime(a, t);
  S.selected = null; S.dirty = true;
  sfx.assign();
}

function complete(a) {
  const t = a.task, lvl = lvlOf(a, t.type);
  S.streak++; S.maxStreak = Math.max(S.maxStreak, S.streak);
  const mult = 1 + Math.min(S.streak - 1, CFG.streakCap) * CFG.streakStep;
  const pay = Math.round((t.bug ? 6 : CFG.pay(t.size, S.sprint)) * mult);
  S.money += pay; S.cur.income += pay; S.cur.done++; S.stats.done++;
  // Learning by doing: XP is what turns an agent into a specialist.
  a.xp[t.type] = (a.xp[t.type] || 0) + (t.bug ? 1 : t.size);
  const after = lvlOf(a, t.type);
  if (!t.bug && R.luck() < CFG.lvlBug[lvl] * S.bugMul) S.pending.push({ at: S.sprintT + rnd(3, 6), type: t.type, name: t.name });

  const el = agentEls.get(a.id);
  floatAt(el, '+' + pay + ' 💰');
  burst(el, TYPES[t.type].hex, 6 + Math.min(S.streak, 10));
  if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
  bump('#hMoney');
  sfx.done(S.streak);
  log(fmt(T().log.done, { a: a.name, t: taskName(t), p: pay }));
  a.task = null; a.progress = 0; S.dirty = true;

  if (after > lvl) levelToast(a, t.type, after, false);
  if (t.chain && S.chains[t.chain]) {
    const ch = S.chains[t.chain];
    if (t.stage + 1 < CHAIN.length) spawnTask({ type: CHAIN[t.stage + 1], chain: ch.id, stage: t.stage + 1, fname: ch.fname, size: ch.size });
    else {
      const bonus = CFG.chainBonus(S.sprint);
      S.money += bonus; S.cur.income += bonus; S.cur.chains++; S.stats.chains++;
      S.rep = Math.min(CFG.maxRep, S.rep + 1);
      delete S.chains[t.chain];
      comboPop('🔗 ' + T().features[ch.fname % 8], true);
      toast('🔗', fmt(T().chainToast, { f: T().features[ch.fname % 8] }), fmt(T().chainSub, { n: bonus }));
      sfx.chain(); buzz(40);
    }
  } else if (S.streak % 5 === 0) { comboPop(fmt(T().combo, { n: S.streak })); sfx.combo(); }
  checkAch();
}

function levelToast(a, type, l, fromTraining) {
  S.stats.lvups++;
  toast(TYPES[type].icon, fmt(T().lvToast, { a: a.name, t: typeName(type), l: T().lv[l] }), fromTraining ? T().lvSubT : T().lvSub);
  sfx.ach();
  checkAch();
}

function hurt(kind, t) {
  S.rep--; S.streak = 0; S.cur.missed++;
  if (t && t.chain) delete S.chains[t.chain]; // a missed stage kills the feature
  log(fmt(T().log[kind], { t: t ? taskName(t) : '' }));
  document.body.classList.remove('hurt'); void document.body.offsetWidth; document.body.classList.add('hurt');
  const app = $('#app'); app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
  floatAt($('#hRep'), '−⭐', true);
  sfx.hurt(); buzz([60, 40, 60]);
  if (S.rep <= 0) endGame('rep');
}

function update(dt) {
  S.sprintT += dt;
  S.spawnIn -= dt;
  if (S.spawnIn <= 0) {
    spawnNext();
    S.spawnIn = Math.max(CFG.spawnMin, CFG.spawnBase - (S.sprint - 1) * CFG.spawnStep) * rnd(0.75, 1.25, R.deal);
    if (S.phase !== 'sprint') return;
  }
  for (const p of S.pending.filter(p => p.at <= S.sprintT)) {
    S.pending = S.pending.filter(x => x !== p);
    S.cur.bugs++;
    spawnTask({ type: p.type, name: p.name, bug: true, size: 1, patience: 25 });
    log(fmt(T().log.bug, { t: T().tasks[p.type][p.name % 8] }));
    if (S.phase !== 'sprint') return;
    sfx.deny();
  }
  for (const t of [...S.tasks]) {
    t.left -= dt;
    if (t.left <= 0) {
      S.tasks = S.tasks.filter(x => x !== t);
      if (S.selected === t.id) S.selected = null;
      S.dirty = true;
      hurt('missed', t);
      if (S.phase !== 'sprint') return;
    }
  }
  for (const a of S.agents) {
    if (!a.task) continue;
    a.progress += dt;
    if (a.progress >= a.work) complete(a);
  }
  if (!S.endWarned && CFG.sprintLen - S.sprintT <= 10) { S.endWarned = true; log(T().log.ending); }
  if (S.sprintT >= CFG.sprintLen) endSprint();
}

function endSprint() {
  S.phase = 'plan'; S.selected = null; S.dirty = true;
  // Training finishes at the end of the sprint the agent sat out.
  for (const a of S.agents) if (a.training) {
    const ty = a.training; a.training = null;
    const l = lvlOf(a, ty) + 1;
    a.xp[ty] = Math.max(a.xp[ty] || 0, CFG.lvlXp[l]);
    levelToast(a, ty, l, true);
  }
  const pay = payroll();
  S.money -= pay;
  S.history.push({ ...S.cur, payroll: pay });
  if (S.cur.done >= 8 && S.cur.missed === 0) unlock('perfect');
  if (S.money < 0) return endGame('broke');
  if (S.sprint >= CFG.sprints) return endGame('win');
  S.plan = { cands: [], open: null, fire: null };
  S.plan.cands = makeCandidates(S.sprint + 1);
  sfx.level();
  showOverlay(planView);
}

function startSprint() {
  S.sprint++;
  S.sprintT = 0; S.endWarned = false; S.spawnIn = 1.2;
  S.cur = freshSprintStats();
  S.phase = 'sprint'; S.plan = null; S.dirty = true;
  hideOverlay();
  comboPop(fmt(T().sprintGo, { n: S.sprint }), true);
  log(fmt(T().log.sprint, { n: S.sprint }));
  sfx.assign();
}

/* ---------- Planning ---------- */
function makeCandidates(n) {
  if (S.agents.length >= CFG.maxAgents) return [];
  const types = typesFor(n);
  const covered = new Set(types.filter(t => S.agents.some(a => lvlOf(a, t) >= 1)));
  const missing = types.filter(t => !covered.has(t));
  const out = [];
  for (let i = 0; i < 2; i++) {
    const type = missing[i] || pick(types.filter(t => !out.some(c => c.type === t)).concat(out.length ? [] : types));
    const lvl = n >= 4 && R.luck() < 0.3 ? 2 : 1;
    const [name, avatar] = freshIdentity();
    out.push({ id: 'k' + uid++, name, avatar, type, lvl, fee: CFG.hire[lvl].fee + (n - 2) * 10, salary: CFG.hire[lvl].salary });
    S.plan.cands = out; // so freshIdentity avoids duplicates
  }
  return out;
}
function planAct(act, id, extra) {
  const L = S.plan;
  if (act === 'hire') {
    const c = L.cands.find(x => x.id === id);
    if (!c || S.money < c.fee || S.agents.length >= CFG.maxAgents) return;
    S.money -= c.fee;
    const a = mkAgent(c.name, c.avatar, c.type, c.lvl);
    a.salaryExtra = c.salary - (CFG.salaryBase + CFG.salaryPerLevel * (c.lvl - 1));
    S.agents.push(a);
    L.cands = L.cands.filter(x => x !== c);
    unlock('hire'); sfx.coin();
  }
  if (act === 'trainOpen') { L.open = L.open === id ? null : id; L.fire = null; }
  if (act === 'train') {
    const a = S.agents.find(x => x.id === id);
    const target = lvlOf(a, extra) + 1, cost = CFG.trainCost[target];
    if (!a || a.training || target > 3 || S.money < cost) return;
    S.money -= cost;
    a.training = extra;
    if (a.task) { returnTask(a.task); a.task = null; a.progress = 0; }
    L.open = null; sfx.coin();
  }
  if (act === 'untrain') {
    const a = S.agents.find(x => x.id === id);
    if (!a || !a.training) return;
    S.money += CFG.trainCost[lvlOf(a, a.training) + 1];
    a.training = null;
  }
  if (act === 'fire') {
    if (S.agents.length <= 1) return;
    if (L.fire !== id) { L.fire = id; L.open = null; }
    else {
      const a = S.agents.find(x => x.id === id);
      if (a.task) returnTask(a.task);
      S.agents = S.agents.filter(x => x !== a);
      agentEls.get(a.id)?.remove(); agentEls.delete(a.id);
      L.fire = null;
    }
  }
  if (act === 'buy') {
    const it = SHOP.find(x => x.k === id);
    if (!it || S.owned[id] || S.money < it.cost) return;
    S.money -= it.cost; S.owned[id] = true;
    if (id === 'inbox') S.cap += 2;
    if (id === 'tools' || id === 'tools2') S.speed *= 1.2;
    if (id === 'review') S.bugMul *= 0.5;
    sfx.coin();
  }
  S.dirty = true;
  checkAch();
  planView();
}
function returnTask(t) { t.left = t.patience; S.tasks.unshift(t); S.dirty = true; }

/* ---------- Achievements ---------- */
function unlock(id) {
  if (P.ach.includes(id)) return;
  P.ach.push(id); save();
  const a = ACH.find(x => x[0] === id);
  setTimeout(() => { toast(a[1], T().achToast, lang === 'es' ? a[2] : a[3]); sfx.ach(); }, 200);
}
function checkAch() {
  if (!S) return;
  if (S.stats.done >= 1) unlock('first');
  const lv = Math.max(0, ...S.agents.map(a => Math.max(...Object.keys(TYPES).map(t => lvlOf(a, t)))));
  if (lv >= 2) unlock('sr');
  if (lv >= 3) unlock('expert');
  if (S.stats.chains >= 1) unlock('chain');
  if (S.stats.chains >= 5) unlock('chain5');
  if (S.streak >= 15) unlock('streak15');
  if (S.agents.length >= 5) unlock('team5');
  if (S.money >= 1500) unlock('rich');
}

/* ---------- Juice ---------- */
function log(msg) { $('#log').innerHTML = `<span>${esc(msg)}</span>`; }
function floatAt(el, text, bad) {
  if (!el) return;
  const r = el.getBoundingClientRect();
  const f = document.createElement('div');
  f.className = 'float' + (bad ? ' bad' : '');
  f.textContent = text;
  f.style.left = (r.left + r.width / 2 - 24) + 'px';
  f.style.top = (r.top + 4) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
}
function burst(el, color, n) {
  if (!el || reduced) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + 32, cy = r.top + 30;
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.className = 'spark';
    const ang = Math.random() * Math.PI * 2, d = 30 + Math.random() * 50;
    p.style.left = cx + 'px'; p.style.top = cy + 'px';
    p.style.background = i % 3 ? color : '#fff';
    p.style.setProperty('--dx', Math.cos(ang) * d + 'px');
    p.style.setProperty('--dy', Math.sin(ang) * d - 20 + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 750);
  }
}
function comboPop(text, blue) {
  const c = document.createElement('div');
  c.className = 'combo' + (blue ? ' blue' : ''); c.textContent = text;
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 1100);
}
function toast(icon, title, sub) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="ti">${icon}</span><span><b>${esc(title)}</b><small>${esc(sub || '')}</small></span>`;
  const box = $('#toasts');
  box.appendChild(t);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(() => t.remove(), 3200);
}
function bump(sel) { const e = $(sel); if (!e) return; e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }

/* ---------- Rendering ---------- */
const taskEls = new Map(), agentEls = new Map();
function skillChips(a, showUnskilled) {

    .map(t => { const l = lvlOf(a, t); return `<span class="chip${l ? '' : ' dim'}" style="--c:${TYPES[t].c}">${TYPES[t].icon} ${typeName(t)}${l ? ' ' + T().lv[l] : ''}</span>`; }).join('');

function renderLists() {

  let empty = box.querySelector('.empty');

    if (!empty) { empty = document.createElement('div'); empty.className = 'empty'; box.appendChild(empty); }
    empty.textContent = T().empty;
  } else if (empty) empty.remove();
  const hintId = S.phase === 'sprint' && P.games === 0 && S.stats.done === 0 && !S.selected && !S.agents.some(a => a.task) ? S.tasks[0]?.id : null;
  S.tasks.forEach((t, i) => {
    let el = taskEls.get(t.id);

    el._pay.textContent = (t.bug ? 6 : CFG.pay(t.size, S.sprint)) + ' 💰';

    el.classList.toggle('busy', !!a.task);
    el.classList.toggle('away', !!a.training);

  $('#payTag').textContent = fmt(T().payroll, { n: payroll() });
}
function resetBoard() {

  $('#tasks').innerHTML = ''; $('#agents').innerHTML = '';
}
function renderFrame() {
  for (const t of S.tasks) {
    const el = taskEls.get(t.id);

  }
  $('#hMoney').textContent = '💰 ' + nf(S.money);
  $('#hSprint').textContent = `${S.sprint}/${CFG.sprints}`;
  const left = 1 - S.sprintT / CFG.sprintLen;
  $('#hTime').style.width = (Math.max(0, left) * 100).toFixed(1) + '%';
  $('#sSprint').classList.toggle('ending', left < 0.15);
  const repHtml = stars(S.rep);
  if ($('#hRep')._v !== repHtml) { $('#hRep').innerHTML = repHtml; $('#hRep')._v = repHtml; }
  $('#hStreak').textContent = '×' + (1 + Math.min(S.streak, CFG.streakCap) * CFG.streakStep).toFixed(2) + (S.streak >= 5 ? ' 🔥' : '');
  $('#sStreak').classList.toggle('hot', S.streak >= 5);

}

    ${P.best ? `<div class="meta">
      <span>${fmt(L.bestL, { s: nf(P.best) })}</span>
      <span>${fmt(L.rankNow, { r: RANKS[rankOf(P.best)][1] + ' ' + rankName(rankOf(P.best)) })}</span>
      <span>${fmt(L.achCount, { n: P.ach.length, t: ACH.length })}</span>
      ${streakOn ? `<span>${fmt(L.dStreak, { n: P.dstreak })}</span>` : ''}
    </div>` : ''}
    <div class="actions">
      <button class="btn daily" data-act="daily">📅 ${fmt(L.daily, { n })}</button>
      <button class="btn primary" data-act="start">${L.free} ▶</button>
      <button class="btn" data-act="lang">${lang === 'es' ? '🇬🇧 English' : '🇪🇸 Español'}</button>
    </div>
    <p class="kb" style="margin:8px 0 0">${L.dailyInfo}${today ? ' · ' + fmt(L.dailyDone, { s: nf(today) }) : ''}</p>
    ${P.ach.length ? `<div class="achs" style="margin-top:12px">${ACH.map(a => `<span class="${P.ach.includes(a[0]) ? '' : 'off'}" title="${esc(lang === 'es' ? a[2] + ': ' + a[4] : a[3] + ': ' + a[5])}">${a[1]}</span>`).join('')}</div>` : ''}`;
}
function pauseView() {
  const L = T();
  $('#card').className = 'card';
  $('#card').innerHTML = `<div class="big">☕</div><h2>${L.paused}</h2><p>${L.pausedSub}</p>
    <div class="actions"><button class="btn primary" data-act="resume">${L.resume} ▶</button></div>`;
}

function planView() {
  const L = T(), h = S.history[S.history.length - 1], next = S.sprint + 1, pl = S.plan;
  const pay = payroll();
  const news = L.newsTxt[next] || [];
  const types = typesFor(next);
  const team = S.agents.map(a => {
    const sal = salaryOf(a);
    const best = Object.keys(TYPES).filter(t => (a.xp[t] || 0) > 0).sort((x, y) => (a.xp[y] || 0) - (a.xp[x] || 0))[0];
    const bl = best ? lvlOf(a, best) : 0;
    const nextXp = CFG.lvlXp[bl + 1];
    const xpBar = best && nextXp ? `<div class="xp" title="XP"><i style="width:${Math.min(100, ((a.xp[best] - CFG.lvlXp[bl]) / (nextXp - CFG.lvlXp[bl])) * 100).toFixed(0)}%"></i></div>` : '';
    let sub = '';
    if (a.training) sub = `<div class="sub">${fmt(L.training, { t: typeName(a.training) })} <button class="btn sm" data-act="untrain" data-id="${a.id}">${L.btnCancel}</button></div>`;
    else if (pl.open === a.id) sub = `<div class="sub">${L.trainHint} ${types.map(t => {
      const tl = lvlOf(a, t) + 1; if (tl > 3) return '';
      const c = CFG.trainCost[tl];
      return `<button class="btn sm" data-act="train" data-id="${a.id}" data-x="${t}" ${S.money < c ? 'disabled' : ''}>${TYPES[t].icon} ${fmt(L.trainTo, { t: typeName(t), l: L.lv[tl] })} · <span class="cost">${c} 💰</span></button>`;
    }).join('')}</div>`;
    return `<div class="row"><div class="av">${a.avatar}</div>
      <div><div class="nm">${esc(a.name)} <small>${fmt(L.salary, { n: sal })}</small></div><div class="sk">${skillChips(a, true)}</div>${xpBar}</div>
      <div class="btns">
        ${a.training ? '' : `<button class="btn sm" data-act="trainOpen" data-id="${a.id}">${L.btnTrain}</button>`}
        ${S.agents.length > 1 ? `<button class="btn sm danger" data-act="fire" data-id="${a.id}">${pl.fire === a.id ? L.btnSure : L.btnFire}</button>` : ''}
      </div>${sub}</div>`;
  }).join('');
  const cands = S.agents.length >= CFG.maxAgents ? `<p class="kb">${L.teamFull}</p>` : pl.cands.length ? pl.cands.map(c => `
    <div class="row"><div class="av">${c.avatar}</div>
      <div><div class="nm">${esc(c.name)} <small>${fmt(L.salary, { n: c.salary })}</small></div>
      <div class="sk"><span class="chip" style="--c:${TYPES[c.type].c}">${TYPES[c.type].icon} ${typeName(c.type)} ${L.lv[c.lvl]}</span></div></div>
      <div class="btns"><button class="btn sm primary" data-act="hire" data-id="${c.id}" ${S.money < c.fee ? 'disabled' : ''}>${L.btnHire} · ${c.fee} 💰</button></div></div>`).join('')
    : `<p class="kb">${L.noCands}</p>`;
  const shopItems = SHOP.filter(it => next >= it.from && (!it.needs || S.owned[it.needs]));
  const shop = shopItems.map(it => {
    const own = S.owned[it.k];
    return `<button class="item${own ? ' owned' : ''}" data-act="buy" data-id="${it.k}" ${own || S.money < it.cost ? 'disabled' : ''}>
      <b>${it.icon} ${L.shop[it.k][0]}</b><small>${L.shop[it.k][1]}</small><span class="cost">${own ? L.owned : it.cost + ' 💰'}</span></button>`;
  }).join('');
  $('#card').className = 'card wide';
  $('#card').innerHTML = `
    <h2>${fmt(L.planTitle, { n: S.sprint })}</h2>
    <p style="margin-bottom:4px">${L.planSub}</p>
    <div class="ledger">
      <div><b class="pos">+${nf(h.income)}</b><span>${L.lIncome}</span></div>
      <div><b class="neg">−${nf(h.payroll)}</b><span>${L.lPayroll}</span></div>
      <div><b class="gold">${nf(S.money)}</b><span>${L.lCash}</span></div>
      <div><b>${h.done}</b><span>${L.lTasks}${h.missed ? ' · ' + fmt(L.lMissed, { n: h.missed }) : ''}${h.chains ? ' · ' + fmt(L.lChains, { n: h.chains }) : ''}</span></div>
    </div>
    ${news.length ? `<div class="news">${news.map(x => `<div>${x}</div>`).join('')}</div>` : ''}
    <h3>${L.hTeam}</h3><div class="rows">${team}</div>
    <h3>${L.hCands}</h3><div class="rows">${cands}</div>
    ${shop ? `<h3>${L.hShop}</h3><div class="shop">${shop}</div>` : ''}
    <div class="payroll">
      <span>${fmt(L.nextPay, { n: pay })}${S.money < pay ? `<br><span class="warn">${L.payWarn}</span>` : ''}</span>
      <button class="btn primary" data-act="next">${next === CFG.sprints ? L.lastSprint : fmt(L.start, { n: next })}</button>
    </div>`;
}

function rankBlock(score) {
  const L = T(), i = rankOf(score), next = RANKS[i + 1];
  const pct = next ? (score - RANKS[i][0]) / (next[0] - RANKS[i][0]) * 100 : 100;
  return `<div class="rank"><span class="ri">${RANKS[i][1]}</span><span style="flex:1"><small>${L.rankTitle}</small><b class="rn">${rankName(i)}</b>
    <small>${next ? fmt(L.nearRank, { n: nf(next[0] - score), r: rankName(i + 1) }) : L.topRank}</small>
    <div class="rb"><i style="width:${Math.max(0, pct).toFixed(0)}%"></i></div></span></div>`;
}
const sprintEmoji = h => h.missed === 0 ? '🟩' : h.missed <= 2 ? '🟨' : '🟥';
function trailLine() {
  const cells = S.history.map(sprintEmoji);
  // the sprint you fell in is shown as 💥, the ones you never reached as ⬛
  if (S.result !== 'win') { cells[cells.length - 1] = '💥'; while (cells.length < CFG.sprints) cells.push('⬛'); }
  return cells.join('');
}
let newBest = false;
function finalScore() { return Math.max(0, S.money) + S.rep * 100 + (S.result === 'win' ? 500 : 0); }
function overView() {
  const L = T(), sc = finalScore(), win = S.result === 'win';
  let near = '';
  if (!newBest && P.best > 0 && P.best - sc <= Math.max(150, P.best * 0.12) && P.best > sc) near = fmt(L.nearBest, { n: nf(P.best - sc + 1) });
  else if (!win && CFG.sprints - S.sprint <= 2) near = fmt(L.nearWin, { n: CFG.sprints - S.sprint + 1 });
  $('#card').className = 'card';
  $('#card').innerHTML = `<div class="big">${win ? '🏁' : '🎻'}</div><h2>${win ? L.win : L.over}</h2>
    <p style="margin-bottom:10px">${win ? L.winSub : S.result === 'broke' ? L.overBroke : L.overRep}${S.daily ? ' · ' + fmt(L.dailyTag, { n: S.dayN }) : ''}</p>
    ${newBest ? `<p style="margin:0 0 10px"><span class="badge">${L.newBest}</span></p>` : ''}
    ${near ? `<div class="near">${near}</div>` : ''}
    <div class="ledger">
      <div><b class="gold">${nf(Math.max(0, S.money))}</b><span>${L.sCash}</span></div>
      <div><b>+${S.rep * 100}</b><span>${L.sRep}</span></div>
      <div><b class="pos">+${win ? 500 : 0}</b><span>${L.sWin}</span></div>
      <div><b>${nf(sc)}</b><span>${L.sTotal}</span></div>
    </div>
    <div class="results">
      <div><b>${S.stats.done}</b><span>${L.rDone}</span></div>
      <div><b>${S.stats.chains}</b><span>${L.rChains}</span></div>
      <div><b>${S.history.length}/${CFG.sprints}</b><span>${L.rSprint}</span></div>
    </div>
    ${rankBlock(sc)}
    <div class="grid">${trailLine()}</div>
    <div class="actions">
      <button class="btn primary" data-act="again">${L.again} ↻</button>
      <button class="btn" data-act="share">${L.share} ↗</button>
      <button class="btn" data-act="menu">${L.menu}</button>
      <span class="kb keys">Enter ↻</span>
    </div>
    <p id="shareMsg" class="tip" style="min-height:18px;margin:10px 0 0"></p>`;
}
function endGame(result) {
  if (S.phase === 'over') return;
  S.phase = 'over'; S.result = result;
  if (result === 'win' || result === 'broke') {} // history already pushed in endSprint
  else S.history.push({ ...S.cur, payroll: 0 });
  const sc = finalScore();
  P.games++;
  if (S.daily) {
    const k = dayKey(), y = dayKey(new Date(Date.now() - 864e5));
    newBest = sc > (P.daily[k] || 0);
    P.daily[k] = Math.max(P.daily[k] || 0, sc);
    if (P.dlast !== k) { P.dstreak = P.dlast === y ? P.dstreak + 1 : 1; P.dlast = k; }
    Object.keys(P.daily).sort().slice(0, -30).forEach(d => delete P.daily[d]);
    unlock('daily');
    if (P.dstreak >= 3) unlock('days3');
  } else newBest = sc > P.best && sc > 0;
  if (sc > P.best) P.best = sc;
  if (result === 'win') unlock('seriesA');
  if (rankOf(sc) === RANKS.length - 1) unlock('master');
  save();
  result === 'win' ? sfx.win() : sfx.over();
  showOverlay(overView);
}

async function share() {
  const L = T(), sc = finalScore();
  const head = fmt(L.shareHead, {
    mode: S.daily ? fmt(L.dailyTag, { n: S.dayN }) + ' · ' : '',
    v: nf(sc),
    res: S.result === 'win' ? L.shareWin : fmt(L.shareLose, { n: S.sprint }),
  });
  const url = location.href.split('#')[0].split('?')[0];
  const text = `${head}\n${trailLine()}\n${fmt(L.shareChains, { n: S.stats.chains, s: S.stats.lvups })}\n${L.shareTail}`;
  try {
    if (navigator.share && matchMedia('(pointer:coarse)').matches) { await navigator.share({ title: 'Orquesta', text, url }); return; }
    await navigator.clipboard.writeText(text + '\n' + url);
    $('#shareMsg').textContent = L.copied;
  } catch (e) {}
}

function startGame(daily) {
  resetBoard();
  newGame(daily);
  S.phase = 'sprint';
  hideOverlay();
  log(daily ? fmt(T().log.startDaily, { n: S.dayN }) : T().log.start);
  comboPop(fmt(T().sprintGo, { n: 1 }), true);
  sfx.assign();
}
function togglePause() {
  if (S.phase !== 'sprint') return;
  if (overlayView && overlayView !== pauseView) return;
  S.paused = !S.paused;
  S.paused ? showOverlay(pauseView) : hideOverlay();
}
function toggleLang() { lang = lang === 'es' ? 'en' : 'es'; P.lang = lang; save(); renderStatic(); }
function toggleSound() { P.sound = !P.sound; save(); $('#soundBtn').textContent = P.sound ? '🔊' : '🔇'; if (P.sound) sfx.select(); }

/* ---------- Input ---------- */
const playing = () => S.phase === 'sprint' && !S.paused;
$('#tasks').addEventListener('click', e => {
  const el = e.target.closest('.task');
  if (!el || !playing()) return;
  S.selected = S.selected === el.dataset.tId ? null : el.dataset.tId;
  S.dirty = true; sfx.select();
});
$('#agents').addEventListener('click', e => {
  const el = e.target.closest('.agent');
  if (!el || !playing()) return;
  if (S.selected) assign(S.selected, el.dataset.a);
  else { log(T().log.select); sfx.deny(); }
});
$('#card').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (overlayView === planView && act !== 'next') return planAct(act, b.dataset.id, b.dataset.x);
  if (act === 'next') startSprint();
  if (act === 'start') startGame(false);
  if (act === 'daily') startGame(true);
  if (act === 'again') startGame(S.daily);
  if (act === 'menu') { resetBoard(); newGame(false); S.dirty = true; showOverlay(startView); }
  if (act === 'resume') togglePause();
  if (act === 'share') share();
  if (act === 'lang') toggleLang();
});
$('#pauseBtn').addEventListener('click', togglePause);
$('#langBtn').addEventListener('click', toggleLang);
$('#soundBtn').addEventListener('click', toggleSound);
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (overlayView === overView && (e.key === 'Enter' || e.key === 'r' || e.key === 'R')) { e.preventDefault(); return startGame(S.daily); }
  if (e.key === 'm' || e.key === 'M') return toggleSound();
  if (e.key === 'p' || e.key === 'P') return togglePause();
  if (!playing()) return;
  if (e.key === 'Escape') { S.selected = null; S.dirty = true; return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= S.agents.length) {
    const a = S.agents[n - 1];
    if (!S.selected) {
      const best = S.tasks.filter(t => isSkilled(a, t)).sort((x, y) => x.left - y.left)[0];
      if (best) S.selected = best.id; else { sfx.deny(); return log(T().log.select); }
    }
    assign(S.selected, a.id);
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && playing()) togglePause(); });

/* ---------- Loop ---------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.1, last ? (ts - last) / 1000 : 0);
  last = ts;
  if (playing()) update(dt);
  if (S.dirty) { renderLists(); S.dirty = false; }
  renderFrame();
  requestAnimationFrame(frame);
}
// Test hook: lets the automated balance bot run the simulation faster than real time.
window.__orq = { get S() { return S; }, assign, step: (sec) => { for (let i = 0; i < sec * 20; i++) if (playing()) update(0.05); S.dirty = true; }, CFG };

newGame(false);
renderStatic();
showOverlay(startView);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
